# deploy/nginx/nginx.local.conf
# 本地开发用 — 纯 HTTP，不需要 SSL 证书

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream gateway_backend {
        server gateway:8080;
    }

    upstream reservation_backend {
        server reservation:8081;
    }

    upstream admin_backend {
        server admin:8082;
    }

    server {
        listen 80;
        server_name localhost;

        # 健康检查
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # 微信服务器消息入口
        location /wx {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 微信 OAuth 回调
        location /api/gateway/auth {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE 实时推送端点（必须在 /api/reservation/ 之前，Nginx 最长前缀匹配）
        location /api/reservation/events {
            proxy_pass http://reservation_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }

        # 预约 API
        location /api/reservation/ {
            proxy_pass http://reservation_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE 实时推送端点（Admin）
        location /api/admin/events {
            proxy_pass http://admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }

        location /api/admin/ {
            proxy_pass http://admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 管理后台 SPA
        location /admin {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 预约 SPA（必须放在最后，通配路径）
        location / {
            root /usr/share/nginx/html/reservation;
            try_files $uri $uri/ /index.html;
        }
    }
}
