# 本地开发 Docker Compose 配置
# 使用方法: docker compose -f docker-compose.local.yaml up --build
#
# 架构说明: 单体应用，监听 :8080，通过 Nginx 反向代理统一对外提供服务。

services:
  # ============ 基础设施 ============

  mysql:
    image: mysql:8.0
    container_name: reservation-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./deploy/mysql/init.test.sql:/docker-entrypoint-initdb.d/02_init_test.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservation-net

  redis:
    image: redis:7-alpine
    container_name: reservation-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservation-net

  # ============ 应用服务 ============

  server:
    image: ${SERVER_IMAGE:-reservation-server:latest}
    container_name: reservation-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=configs/config.yaml
    volumes:
      - ./configs:/app/configs:ro
    networks:
      - reservation-net

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: reservation-nginx
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.local.config:/etc/nginx/nginx.conf:ro
      - ./dist/reservation/:/usr/share/nginx/html/reservation/:ro
      - ./dist/admin/:/usr/share/nginx/html/admin/:ro
    networks:
      - reservation-net

networks:
  reservation-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
